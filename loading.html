<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COMPASS - Loading</title>
  <link rel="icon" type="image/png" href="assets/icons/compass.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }

    @keyframes compassSpin {
      0%   { transform: rotate(0deg); }
      25%  { transform: rotate(90deg); }
      50%  { transform: rotate(180deg); }
      75%  { transform: rotate(270deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes compassPulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.05); }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes dotPulse {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1); }
    }

    .compass-spin {
      animation: compassSpin 2.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .compass-body {
      animation: compassPulse 2s ease-in-out infinite;
    }
    .fade-in-up {
      animation: fadeInUp 0.6s ease forwards;
    }
    .fade-in-up-delay-1 { animation-delay: 0.15s; opacity: 0; }
    .fade-in-up-delay-2 { animation-delay: 0.3s; opacity: 0; }
    .fade-in-up-delay-3 { animation-delay: 0.45s; opacity: 0; }

    .loading-dot { animation: dotPulse 1.4s ease-in-out infinite; }
    .loading-dot:nth-child(2) { animation-delay: 0.2s; }
    .loading-dot:nth-child(3) { animation-delay: 0.4s; }

    #progressFill { transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); }

    .page-fade-out {
      opacity: 0 !important;
      transform: scale(1.02);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-white via-blue-50/30 to-white min-h-screen flex items-center justify-center overflow-hidden">

  <div id="loadingContainer" class="flex flex-col items-center gap-8 transition-all duration-500">

    <!-- Compass Visual -->
    <div class="compass-body relative w-36 h-36 sm:w-40 sm:h-40 flex items-center justify-center fade-in-up">
      <!-- Outer ring -->
      <div class="absolute inset-0 rounded-full border-[3px] border-blue-200/60"></div>
      <div class="absolute inset-[3px] rounded-full border-[2px] border-blue-100/40"></div>
      <!-- Tick marks -->
      <div class="absolute inset-0 rounded-full" style="background:conic-gradient(from 0deg, transparent 0deg, transparent 89deg, #93C5FD 89deg, #93C5FD 91deg, transparent 91deg, transparent 179deg, #93C5FD 179deg, #93C5FD 181deg, transparent 181deg, transparent 269deg, #93C5FD 269deg, #93C5FD 271deg, transparent 271deg, transparent 359deg, #93C5FD 359deg, #93C5FD 361deg);-webkit-mask:radial-gradient(circle,transparent 62%,black 63%,black 100%);mask:radial-gradient(circle,transparent 62%,black 63%,black 100%);"></div>

      <!-- Cardinal markers -->
      <span class="absolute top-3 left-1/2 -translate-x-1/2 text-[11px] font-extrabold text-blue-600">N</span>
      <span class="absolute bottom-3 left-1/2 -translate-x-1/2 text-[10px] font-bold text-gray-300">S</span>
      <span class="absolute left-3 top-1/2 -translate-y-1/2 text-[10px] font-bold text-gray-300">W</span>
      <span class="absolute right-3 top-1/2 -translate-y-1/2 text-[10px] font-bold text-gray-300">E</span>

      <!-- Spinning needle -->
      <div class="compass-spin w-full h-full flex items-center justify-center absolute inset-0">
        <svg class="w-[70%] h-[70%]" viewBox="0 0 80 80" fill="none">
          <!-- North needle (blue) -->
          <polygon points="40,10 36,38 44,38" fill="#2563EB"/>
          <polygon points="40,10 37,38 43,38" fill="#1D4ED8" opacity="0.3"/>
          <!-- South needle (light gray) -->
          <polygon points="40,70 36,42 44,42" fill="#D1D5DB"/>
          <polygon points="40,70 37,42 43,42" fill="#9CA3AF" opacity="0.3"/>
          <!-- Center pin -->
          <circle cx="40" cy="40" r="5" fill="white" stroke="#2563EB" stroke-width="2.5"/>
          <circle cx="40" cy="40" r="2" fill="#2563EB"/>
        </svg>
      </div>
    </div>

    <!-- Brand -->
    <div class="text-center fade-in-up fade-in-up-delay-1">
      <h1 class="text-[22px] sm:text-2xl font-bold text-gray-900 tracking-wide">COMPASS</h1>
      <p class="text-[9px] sm:text-[10px] font-semibold text-gray-400 tracking-[4px] mt-1.5">ALUMNI PORTAL</p>
    </div>

    <!-- Progress Bar -->
    <div class="w-52 sm:w-64 fade-in-up fade-in-up-delay-2">
      <div class="w-full h-[6px] bg-gray-200 rounded-full overflow-hidden">
        <div id="progressFill" class="h-full bg-gradient-to-r from-blue-600 to-blue-500 rounded-full" style="width: 0%"></div>
      </div>
      <div class="flex items-center justify-center gap-1 mt-4">
        <p class="text-[12px] text-gray-400" id="loadingText">Preparing your workspace</p>
        <span class="flex gap-[2px] mt-[1px]">
          <span class="loading-dot w-[3px] h-[3px] rounded-full bg-gray-400 inline-block"></span>
          <span class="loading-dot w-[3px] h-[3px] rounded-full bg-gray-400 inline-block"></span>
          <span class="loading-dot w-[3px] h-[3px] rounded-full bg-gray-400 inline-block"></span>
        </span>
      </div>
      <p class="text-[10px] text-gray-300 text-center mt-2" id="progressPercent">0%</p>
    </div>

  </div>

  <script src="js/loading.js"></script>
</body>
</html>
